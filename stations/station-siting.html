<style>
/* Layout: controls on top; orbit map and the objective-versus-supply chart side by side; ranked table below. Dark-only, same tokens as the growth map. */
:root{
  --void:#05070d; --deck:#0c111b; --deck-2:#121a29; --rule:#233049; --grid:#1a2335;
  --ink:#dfe5ef; --dim:#8a96ad; --mute:#4a5670; --sun:#f0b347; --link:#62a6ec;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--void)}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
select{font:inherit;color:inherit;background:var(--deck);border:1px solid var(--rule);border-radius:4px;padding:4px 6px}
select:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
a{color:var(--link)}
.top{display:flex;flex-direction:column;gap:6px;padding-block:14px 8px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
.eyebrow a{color:inherit;text-decoration:none}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.top p{margin:0;color:var(--dim);max-width:80ch}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:8px 10px;border-bottom:1px solid var(--rule)}
.grp{display:flex;gap:6px;align-items:center}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding-block:12px}
.card{background:var(--deck);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;min-width:0}
.card h2{font-family:var(--f-display);font-size:17px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px}
.card .sub{margin:0 0 6px;color:var(--dim);font-size:12.5px}
svg{display:block;width:100%;height:auto}
.note{color:var(--dim);font-size:13px;max-width:90ch;margin:8px 0 0}
.msg{color:var(--sun);font-size:13.5px;margin:6px 0 0}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px 6px 0;text-align:left}
th{color:var(--dim);font-weight:500}
tr.sel td{color:var(--sun)}
.tablewrap{overflow-x:auto}
#tip{position:fixed;pointer-events:none;background:var(--deck-2);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;font-size:12.5px;display:none;max-width:280px;z-index:5}
@media (max-width:900px){.main{grid-template-columns:1fr}}
</style>
<div class="top">
  <p class="eyebrow"><a href="https://bhanneke.github.io/deep-space-strategy/">Deep Space Strategy</a> · Settlement and transport</p>
  <h1>Station Siting</h1>
  <p>Which solar orbit suits a station best depends on what the station should do and on the available technology. The page ranks 4,140 candidate orbits by the objective you choose.</p>
</div>

<script>
const D = JSON.parse(document.getElementById('stn-data').textContent);
const C = D.candidates, N = C.length, $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('ve').innerHTML = Object.entries(D.meta.ve).map(([k, v]) => `<option value="${k}" ${k === 'hydrogen/oxygen' ? 'selected' : ''}>${k}, ${v} km/s</option>`).join('');
$('src').innerHTML = D.meta.sources.map((s, i) => `<option value="${s}" ${i === 1 ? 'selected' : ''}>${s}</option>`).join('');
const state = { obj: 'network', ve: 'hydrogen/oxygen', src: D.meta.sources[1], k: 2 };

const per = c => Math.pow(C[c].a, 1.5);
const label = c => C[c].name || `Solar orbit a ${C[c].a.toFixed(1)} AU, e ${C[c].e}, i ${C[c].i}°`;
const range = c => C[c].name ? `${C[c].a} AU (with ${C[c].site === 'eml1' ? 'Earth' : C[c].site[0].toUpperCase() + C[c].site.slice(1)})` : `${(C[c].a * (1 - C[c].e)).toFixed(2)}–${(C[c].a * (1 + C[c].e)).toFixed(2)} AU`;

// score per candidate for the chosen objective; higher is better everywhere (reach is a cost, so ranking uses its negative)
function scores() {
  if (state.obj === 'value') return D.value[state.ve];
  if (state.obj === 'reach') return D.reach.map(x => -x);
  return D.network.single_gain;
}
function shown(c, s) {
  if (state.obj === 'value') return (100 * s).toFixed(1) + '%';
  if (state.obj === 'reach') return (-s).toFixed(2) + ' km/s';
  return '−' + s.toFixed(2) + ' km/s';
}
function selection() {
  if (state.obj === 'network') { const set = D.network.sets.find(x => x.k === state.k); return { picks: set.stations, setValue: set.mean_leg }; }
  const s = scores(), order = Array.from({ length: N }, (_, i) => i).sort((a, b) => s[b] - s[a]);
  return { picks: order.slice(0, state.k), setValue: null };
}
function pareto(xs, ys) {                // the best score available at each supply cost
  const idx = Array.from({ length: N }, (_, i) => i).sort((a, b) => xs[a] - xs[b] || ys[b] - ys[a]);
  const f = []; let best = -Infinity;
  for (const i of idx) if (ys[i] > best) { f.push(i); best = ys[i]; }
  return f;
}

function kepler(M, e) { let E = M; for (let i = 0; i < 20; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); return E; }
function drawMap(picks) {
  const S = 520, cx = S / 2, R = 3.4, k = (S / 2 - 18) / R, accent = css('--sun'), grid = css('--grid'), dim = css('--dim'), mute = css('--mute');
  const P = [['Mercury', 0.387], ['Venus', 0.723], ['Earth', 1.0], ['Mars', 1.524], ['Vesta', 2.36], ['Ceres', 2.77], ['Psyche', 2.92]];
  let g = `<circle cx="${cx}" cy="${cx}" r="5" fill="${accent}"/>`;
  for (const [n, a] of P) g += `<circle cx="${cx}" cy="${cx}" r="${a * k}" fill="none" stroke="${grid}" stroke-width="1.2"/><text x="${cx + a * k * 0.707 + 3}" y="${cx - a * k * 0.707 - 3}" font-size="11" fill="${dim}">${n}</text>`;
  picks.forEach((c, i) => {
    if (C[c].name) { const r = C[c].a * k; g += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${accent}" stroke-width="2" stroke-dasharray="2 4"/><text x="${cx - r * 0.707 - 4}" y="${cx + r * 0.707 + 14}" text-anchor="end" font-size="12" font-weight="600" fill="${css('--ink')}">${i + 1} ${esc(C[c].name)}</text>`; return; }
    const o = C[c], w = o.w * Math.PI / 180, ci = Math.cos(o.i * Math.PI / 180), pts = [];
    for (let t = 0; t <= 120; t++) { const E = 2 * Math.PI * t / 120, x = o.a * (Math.cos(E) - o.e), y = o.a * Math.sqrt(1 - o.e * o.e) * Math.sin(E) * ci;
      pts.push([cx + k * (x * Math.cos(w) - y * Math.sin(w)), cx - k * (x * Math.sin(w) + y * Math.cos(w))]); }
    g += `<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${accent}" stroke-width="2"/>`;
    const E = kepler(o.M0 * Math.PI / 180, o.e), x = o.a * (Math.cos(E) - o.e), y = o.a * Math.sqrt(1 - o.e * o.e) * Math.sin(E) * ci;
    const px = cx + k * (x * Math.cos(w) - y * Math.sin(w)), py = cx - k * (x * Math.sin(w) + y * Math.cos(w));
    g += `<circle cx="${px}" cy="${py}" r="6" fill="${accent}" stroke="${css('--void')}" stroke-width="2"><title>Station ${i + 1}: ${label(c)}</title></circle><text x="${px + 9}" y="${py + 4}" font-size="12" font-weight="600" fill="${css('--ink')}">${i + 1}</text>`;
  });
  $('map').innerHTML = g;
  $('mapsub').textContent = `View from above the plane of the planets, out to 3.4 AU. The map draws planet orbits as circles. Solid gold: station orbits, with each station's position on 1 January 2027. Dotted gold: stations at a planet or at Earth–Moon L1.`;
}

function drawChart(picks) {
  const s = scores(), sup = D.supply[state.src], W = 560, H = 420, L = 58, R = 16, T = 14, B = 46;
  const ys = s.map(v => state.obj === 'reach' ? -v : v), lo = Math.min(...ys), hi = Math.max(...ys);
  const xlo = Math.floor(Math.min(...sup)), xhi = Math.ceil(Math.max(...sup));
  const X = v => L + (v - xlo) / (xhi - xlo) * (W - L - R), Y = v => T + (state.obj === 'reach' ? (v - lo) / (hi - lo) : (hi - v) / (hi - lo)) * (H - T - B);
  const grid = css('--grid'), dim = css('--dim'), mute = css('--mute'), accent = css('--sun');
  let g = '';
  const yt = niceTicks(lo, hi), xt = niceTicks(xlo, xhi);
  for (const v of yt) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="${dim}">${state.obj === 'value' ? (100 * v).toFixed(0) + '%' : +v.toFixed(2)}</text>`;
  for (const v of xt) g += `<text x="${X(v)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="${dim}">${v}</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle" font-size="11.5" fill="${dim}">Supply cost from ${esc(state.src.replace('+ ', ''))}, km/s (lower is better)</text>`;
  for (let c = 0; c < N; c++) g += `<circle cx="${X(sup[c]).toFixed(1)}" cy="${Y(ys[c]).toFixed(1)}" r="2.2" fill="${mute}" data-c="${c}"/>`;
  const f = pareto(sup, s);
  g += `<polyline points="${f.map(c => X(sup[c]).toFixed(1) + ',' + Y(ys[c]).toFixed(1)).join(' ')}" fill="none" stroke="${dim}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  picks.forEach((c, i) => { g += `<circle cx="${X(sup[c])}" cy="${Y(ys[c])}" r="6" fill="${accent}" stroke="${css('--void')}" stroke-width="2" data-c="${c}"/><text x="${X(sup[c]) + 9}" y="${Y(ys[c]) + 4}" font-size="12" font-weight="600" fill="${css('--ink')}">${i + 1}</text>`; });
  // invisible larger hit targets for hover
  for (let c = 0; c < N; c++) g += `<circle cx="${X(sup[c]).toFixed(1)}" cy="${Y(ys[c]).toFixed(1)}" r="6" fill="transparent" data-c="${c}"/>`;
  $('chart').innerHTML = g;
  const unit = { value: 'share of Earth-launched fuel one station saves', reach: 'mean cost from the station to all sites, km/s (lower is better)', network: 'km/s by which one station alone shortens the average longer leg' }[state.obj];
  $('chartTitle').textContent = { reach: 'Reach against supply cost', value: 'Fuel saved against supply cost', network: 'Refuelling gain against supply cost' }[state.obj];
  $('chartsub').textContent = `Each dot is one candidate orbit. Vertical: ${unit}. Dashed line: the best score available at each supply cost. Numbered dots: the stations shown on the map.`;
}
function niceTicks(lo, hi) { const span = hi - lo, step = Math.pow(10, Math.floor(Math.log10(span / 4))), m = [1, 2, 5, 10].find(m => span / (step * m) <= 6) * step; const out = []; for (let v = Math.ceil(lo / m) * m; v <= hi + 1e-9; v += m) out.push(+v.toFixed(6)); return out; }

function drawTable(picks, setValue) {
  const s = scores(), sup = D.supply[state.src];
  const head = `<tr><th>#</th><th>Orbit</th><th>Distance from the Sun</th><th>Period</th><th>${{ value: 'Fuel saved', reach: 'Reach', network: 'Gain alone' }[state.obj]}</th><th>Supply cost</th><th>Position 2027</th></tr>`;
  const rows = picks.map((c, i) => `<tr class="sel"><td>${i + 1}</td><td>${label(c)}</td><td>${range(c)}</td><td>${per(c).toFixed(2)} yr</td><td>${shown(c, s[c])}</td><td>${sup[c].toFixed(2)} km/s</td><td>${C[c].name ? '–' : C[c].M0 + '° past perihelion'}</td></tr>`).join('');
  $('tbl').innerHTML = head + rows;
  $('tableTitle').textContent = state.obj === 'network' ? `Best set of ${state.k} station${state.k > 1 ? 's' : ''}: the average longer leg falls from ${D.network.base_mean.toFixed(1)} to ${setValue.toFixed(1)} km/s` : `Top ${state.k} location${state.k > 1 ? 's' : ''} by ${state.obj === 'reach' ? 'reach' : 'fuel saved on trips from Earth'}`;
  $('msg').textContent = state.obj === 'value' && state.src === D.meta.sources[0] ? 'With Earth as the only propellant source, a station saves no fuel launched from Earth. Choose another propellant source to see the savings.' : '';
}

function render() {
  $('kgrp').querySelector('.lbl').textContent = state.obj === 'network' ? 'Stations' : 'Show top';
  $('ve').disabled = state.obj !== 'value';
  const { picks, setValue } = selection();
  drawMap(picks); drawChart(picks); drawTable(picks, setValue);
  $('defs').innerHTML = `<strong>Refuelling stops between sites:</strong> every trip between two of the 12 sites may refuel once at a station of the set; the trip then costs its longer leg, or the direct trip if that is cheaper. The best set minimises the average over all trips and dates, so two stations close together add little. <strong>Fuel saved on trips from Earth:</strong> ${esc(D.meta.objectives.value)}; the engine choice changes this objective only. <strong>Reach:</strong> ${esc(D.meta.objectives.reach)}. <strong>Supply cost:</strong> ${esc(D.meta.objectives.supply)}. Departure dates every 30 days from 2027 for 20 years, with up to 120 days of waiting. Method and formulas: <a href="technical.html#hubs">technical documentation</a>.`;
}
for (const id of ['obj', 've', 'src', 'k']) $(id).addEventListener('change', e => { state[id] = id === 'k' ? +e.target.value : e.target.value; render(); });
const tip = $('tip');
$('chart').addEventListener('mousemove', e => {
  const c = e.target.dataset && e.target.dataset.c; if (c == null) { tip.style.display = 'none'; return; }
  const s = scores();
  tip.innerHTML = `${esc(label(+c))}<br>${range(+c)}, period ${per(+c).toFixed(2)} yr<br>${shown(+c, s[+c])} · supply ${D.supply[state.src][+c].toFixed(2)} km/s`;
  tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 10) + 'px';
});
$('chart').addEventListener('mouseleave', () => { tip.style.display = 'none'; });
render();
</script>
